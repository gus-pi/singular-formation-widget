<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Singular widget · local preview</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#091527;color:white}header{padding:20px;border-bottom:1px solid #33445b}main{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 76px)}form{padding:20px;overflow:auto}fieldset{border:1px solid #33445b;margin-bottom:16px}label{display:block;margin:10px 0;color:#b9ccdf}input{display:block;width:100%;padding:8px;margin-top:5px;background:#11273e;color:white;border:1px solid #3e5977}iframe{width:100%;height:100%;border:0}small{color:#99b3ce}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}form{max-height:40vh}iframe{height:80vh}}</style></head><body><header>Singular widget · local preview<br><small>Tests the widget’s Singular callbacks. Changes apply immediately.</small><br><button id="replayBtn" type="button" style="margin-top:8px;padding:6px 14px;background:#11273e;color:white;border:1px solid #3e5977;cursor:pointer">▶ Replay entrance animation</button></header><main><form id="controls"></form><iframe id="output" title="Formation widget output"></iframe></main><script>
(async()=>{
const [ui,source]=await Promise.all([fetch('ui-definition.json').then(r=>r.json()),fetch('source/output.html').then(r=>r.text())]);
const frame=document.getElementById('output'),values=Object.fromEntries(ui.model.fields.map(f=>[f.id,f.defaultValue]));
for(const group of ui.model.groups){const fieldset=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=group.title;fieldset.append(legend);for(const id of group.childIds){const field=ui.model.fields.find(f=>f.id===id),label=document.createElement('label'),input=document.createElement('input');label.textContent=field.title;input.id=id;input.type=field.type==='number'?'number':'text';input.value=field.defaultValue;for(const prop of ['min','max','step'])if(field[prop]!==undefined)input[prop]=field[prop];input.addEventListener('input',()=>{values[id]=input.value;frame.contentWindow.widgetCallbacks.onValue({[id]:input.value})});label.append(input);fieldset.append(label)}document.getElementById('controls').append(fieldset)}
document.getElementById('controls').onsubmit=e=>e.preventDefault();
function playIn(duration){frame.contentWindow.widgetCallbacks.onAnimation({event:'start',timeline:'In',duration,animationEvent:'play',direction:'forward',easing:{easing:'linear',inOut:'out'},state:'In',oldState:'Out1',newState:'In'})}
document.getElementById('replayBtn').addEventListener('click',()=>playIn(1.0));
frame.onload=()=>{frame.contentWindow.widgetCallbacks.onValue(values);playIn(1.0);const svg=frame.contentDocument.getElementById('graphic');if(svg&&!svg.querySelector('[data-guide]')){const NS='http://www.w3.org/2000/svg';const outer=document.createElementNS(NS,'rect');outer.setAttribute('data-guide','');outer.setAttribute('x',0);outer.setAttribute('y',0);outer.setAttribute('width',894);outer.setAttribute('height',840);outer.setAttribute('fill','none');outer.setAttribute('stroke','#ffcc00');outer.setAttribute('stroke-width',2);svg.insertBefore(outer,svg.firstChild);const safe=document.createElementNS(NS,'rect');safe.setAttribute('data-guide','');safe.setAttribute('x',20);safe.setAttribute('y',0);safe.setAttribute('width',854);safe.setAttribute('height',840);safe.setAttribute('fill','none');safe.setAttribute('stroke','#ff3366');safe.setAttribute('stroke-width',2);safe.setAttribute('stroke-dasharray','10 6');svg.insertBefore(safe,svg.firstChild)}};
const mock='<script>window.SingularWidget={init(callbacks){window.widgetCallbacks=callbacks;callbacks.onInit({});}};<\/script>';
frame.srcdoc=source.replace(/<script src="https:\/\/app.singular.live\/libs\/singularwidget\/1.0.4\/singularwidget.js"><\/script>/,mock);
})().catch(error=>{document.querySelector('header').textContent='Preview failed: '+error.message});
</script></body></html>
